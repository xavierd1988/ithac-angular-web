# Include inside the existing api.ithacapp.com HTTPS server block.
# Preserve its existing location / and certificate configuration.
location = /live {
    return 308 /live/;
}

location ^~ /live/ {
    proxy_pass https://178.105.42.115.sslip.io/;
    proxy_http_version 1.1;
    proxy_set_header Host 178.105.42.115.sslip.io;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_ssl_server_name on;
    proxy_ssl_name 178.105.42.115.sslip.io;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;
}
