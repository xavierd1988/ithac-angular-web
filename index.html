<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#02093E">
  <title>Live Crypto Influencer Ranking</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon-royal-blue.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20261120-royal-blue">
  <link rel="stylesheet" href="./styles.css?v=20260714-call-compact">
  <link rel="stylesheet" href="./ranking.css?v=20261122-rank4">
  <link rel="stylesheet" href="./garage.css?v=20261122-v4g">
  <link rel="stylesheet" href="./new.css?v=20261124-new11">
</head>
<body>
  <main class="app-shell">
    <div class="page-intro">
      <div class="cover-inner">
        <h1 id="pageTitle"><span class="live-word"><span class="live-diode" aria-hidden="true"></span>Live</span> Crypto Influencer Ranking</h1>
        <div class="cover-art" aria-hidden="true">
          <span class="cover-mark"></span>
        </div>
      </div>
      <div class="cover-periods">
        <div class="ranking-period" role="group" aria-label="Result measured after each call">
          <span class="period-glider" aria-hidden="true"></span>
          <button class="period-button active" type="button" data-window="day" aria-pressed="true">24 hours</button>
          <button class="period-button" type="button" data-window="week" aria-pressed="false">7 days</button>
          <button class="period-button" type="button" data-window="month" aria-pressed="false">1 month</button>
        </div>
      </div>
    </div>

    <div class="ranking-layout ranking-layout-solo">
      <aside class="cat-legend" id="catLegend" aria-label="Account types: choose one to show only those accounts" hidden>
        <button class="cat-item" type="button" data-cat="all" aria-pressed="true" title="Every account"><span class="cat-dot cat-all"></span>All</button>
        <button class="cat-item" type="button" data-cat="independent" aria-pressed="false" title="A person sharing their own trades and analysis"><span class="cat-dot cat-independent"></span>Independent</button>
        <button class="cat-item" type="button" data-cat="promoter" aria-pressed="false" title="Mostly paid promotion, airdrops or referral links"><span class="cat-dot cat-promoter"></span>Promoter</button>
        <button class="cat-item" type="button" data-cat="institution" aria-pressed="false" title="A company, project, exchange or news outlet"><span class="cat-dot cat-institution"></span>Institution</button>
        <button class="cat-item" type="button" data-cat="bot" aria-pressed="false" title="Automated posting"><span class="cat-dot cat-bot"></span>Bot</button>
        <button class="cat-item" type="button" data-cat="offtopic" aria-pressed="false" title="Mostly not about crypto, trading or markets"><span class="cat-dot cat-offtopic"></span>Off topic</button>
        <button class="cat-item" type="button" data-cat="inactive" aria-pressed="false" title="No tweet in the last 30 days"><span class="cat-dot cat-inactive"></span>Inactive</button>
      </aside>
      <section class="list-card" aria-labelledby="pageTitle">
        <div class="leaderboard-head" id="listHead">
          <span>Rank</span><span>Name</span>
          <button class="sort-head" type="button" data-sort="followers">Followers</button>
          <button class="sort-head" type="button" data-sort="last"><span class="label-long">Last tweet</span><span class="label-short">Last</span></button>
          <button class="sort-head" type="button" data-sort="tweets"><span class="label-long">Number of tweets</span><span class="label-short">Tweets</span></button>
          <span></span>
        </div>
        <div id="list" class="list">
          <p class="empty">Loading the accounts…</p>
        </div>

        <nav class="pager new-pager" id="pager" aria-label="Ranking pages" hidden>
          <button id="prevPage" type="button">Previous</button>
          <div class="page-numbers" id="pageNumbers"></div>
          <button id="nextPage" type="button">Next</button>
          <label>Rows
            <select id="pageSize">
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100" selected>100</option>
              <option value="250">250</option>
              <option value="500">500</option>
              <option value="1000">1000</option>
            </select>
          </label>
        </nav>
        <div class="ranking-footer">
          <div class="ranking-footer-row">
            <label class="ranking-footer-search">
              <span class="visually-hidden">Search an account</span>
              <input id="rankingSearch" type="search" placeholder="Search an account" autocomplete="off">
            </label>
            <p id="rankingStats" class="ranking-footer-stats" role="status"></p>
          </div>
        </div>
      </section>
    </div>

    <div class="garage-entry">
      <a class="garage-door" href="./garage.html#garage" aria-label="Open the garage: robots, AI analysis, journal of calls and live tools">
        <span class="garage-door-frame" aria-hidden="true">
          <span class="garage-door-panel"></span><span class="garage-door-panel"></span><span class="garage-door-panel"></span><span class="garage-door-panel"></span>
          <span class="garage-door-handle"></span>
        </span>
        <span class="garage-door-label"><strong>Garage</strong><em>Robots, AI analysis, journal and live tools</em></span>
      </a>
    </div>
  </main>
  <script src="./new.js?v=20261124-new11" defer></script>
</body>
</html>
